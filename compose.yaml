name: research-team
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env.postgres with research-db -init-local}
      RESEARCH_DB_PASSWORD: ${RESEARCH_DB_PASSWORD:?Create .env.postgres with research-db -init-local}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 128mb
    stop_grace_period: 30s
volumes:
  postgres_data:
