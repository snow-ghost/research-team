name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_PASSWORD: test-only-database-password
          POSTGRES_DB: research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d research_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RESEARCH_TEST_POSTGRES_DSN: postgres://postgres:test-only-database-password@127.0.0.1:5432/research_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_PASSWORD: test-only-database-password
          POSTGRES_DB: research_web_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d research_web_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MVP_DATABASE_URL: postgres://postgres:test-only-database-password@127.0.0.1:5432/research_web_test?sslmode=disable
    defaults:
      run:
        working-directory: web-research-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-research-demo/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:mvp
